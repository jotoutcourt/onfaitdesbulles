<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save the Date</title>
    <base href="/savethedate/">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Save the Date">
    <meta property="og:description" content="Comme si avoir 30 ans n'&eacute;tait pas d&eacute;j&agrave; assez terrifiant..">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>&#127875;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #0a0808;
    --card-bg: #0f0d0c;
    --gold: #A0A0A0;
    --gold-dim: rgba(160, 160, 160, 0.15);
    --gold-glow: rgba(160, 160, 160, 0.2);
    --seal: #7B1818;
    --seal-light: #A82C2C;
    --text: #E8DDD0;
    --text-dim: #7A6F65;
}

html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    background: var(--bg);
    z-index: 0;
}

.screen.active {
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

.hidden {
    display: none !important;
}

#envelope-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.6) 100%);
    pointer-events: none;
    z-index: 0;
}

.fog {
    position: absolute;
    bottom: 0;
    left: -10%;
    width: 120%;
    height: 25vh;
    pointer-events: none;
    z-index: 0;
}

.fog::before,
.fog::after {
    content: '';
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center bottom, rgba(20, 15, 12, 0.5), transparent 70%);
}

.fog::before {
    animation: fog-drift 18s ease-in-out infinite;
}

.fog::after {
    animation: fog-drift 24s ease-in-out infinite reverse;
    opacity: 0.5;
}

@keyframes fog-drift {
    0%, 100% { transform: translateX(-8%) scaleX(1.2); }
    50% { transform: translateX(8%) scaleX(1); }
}

.particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.particle {
    position: absolute;
    bottom: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(160, 160, 160, 0.8), rgba(160, 160, 160, 0) 70%);
    pointer-events: none;
    animation: particle-rise linear infinite;
}

@keyframes particle-rise {
    0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
    }
    10% {
        opacity: var(--p-opacity, 0.3);
    }
    85% {
        opacity: var(--p-opacity, 0.3);
    }
    100% {
        transform: translateY(-105vh) translateX(var(--p-drift, 20px));
        opacity: 0;
    }
}

.envelope-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    z-index: 1;
}

.envelope {
    position: relative;
    animation: envelope-enter 1.5s ease forwards, envelope-float 4s ease-in-out 1.5s infinite;
    filter: drop-shadow(0 15px 40px rgba(0, 0, 0, 0.5));
    opacity: 0;
}

@keyframes envelope-enter {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.envelope-svg {
    display: block;
    width: 300px;
    height: auto;
}

@keyframes envelope-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

#open-btn {
    background: transparent;
    border: 1px solid rgba(160, 160, 160, 0.35);
    color: var(--gold);
    padding: 0.9rem 2.2rem;
    font-family: 'Cinzel', serif;
    font-weight: 400;
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s ease;
    opacity: 0;
    animation: fadeInUp 0.7s ease 2s forwards;
}

#open-btn:hover {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
}

.envelope-wrapper.opening #open-btn {
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.4s, transform 0.4s;
}

.envelope-wrapper.opening .envelope {
    opacity: 1;
    animation: envelope-dissolve 3s ease forwards;
}

@keyframes envelope-dissolve {
    0% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 15px 40px rgba(0, 0, 0, 0.5));
    }
    60% {
        transform: translateY(-8px) scale(1.02);
        opacity: 1;
        filter: drop-shadow(0 0 25px var(--gold-glow));
    }
    100% {
        transform: translateY(-25px) scale(0.92);
        opacity: 0;
        filter: blur(6px) drop-shadow(0 0 15px var(--gold-glow));
    }
}

#video-screen {
    background: #000;
    flex-direction: column;
}

#invitation-video {
    max-height: 100vh;
    max-width: 100vw;
    height: 100vh;
    width: auto;
    object-fit: contain;
}

.play-fallback {
    position: absolute;
    background: transparent;
    border: 1px solid rgba(160, 160, 160, 0.4);
    color: var(--gold);
    padding: 1rem 2.5rem;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s;
}

.play-fallback:hover {
    background: var(--gold);
    color: #000;
}

.skip-btn {
    position: absolute;
    bottom: 2rem;
    right: 2rem;
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.2);
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    transition: color 0.3s;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.skip-btn:hover {
    color: rgba(255, 255, 255, 0.45);
}

#card-screen {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.card-scroll {
    min-height: 100%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
}

.card {
    background: var(--card-bg);
    border: 1px solid #1c1917;
    max-width: 440px;
    width: 100%;
    padding: 3.5rem 2.5rem;
    text-align: center;
    position: relative;
}

.card::before {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid var(--gold-dim);
    pointer-events: none;
}

.tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: var(--text);
    line-height: 1.8;
    opacity: 0;
}

.big-30 {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 700;
    font-size: 3rem;
    line-height: 1.1;
    margin: 1rem 0 0.5rem;
    background: linear-gradient(180deg, #d0d0d0 0%, #a0a0a0 45%, #707070 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 12px rgba(160, 160, 160, 0.2));
    opacity: 0;
}

.card-title {
    font-family: 'Cinzel', serif;
    font-weight: 400;
    font-size: 1.15rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
    opacity: 0;
}

.divider {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    margin: 1.8rem 0;
    opacity: 0;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    height: 1px;
}

.divider::before {
    background: linear-gradient(to right, transparent, var(--gold-dim));
}

.divider::after {
    background: linear-gradient(to left, transparent, var(--gold-dim));
}

.divider span {
    color: var(--gold);
    font-size: 0.9rem;
    opacity: 0.6;
}

.details {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    text-align: left;
    opacity: 0;
}

.detail-row {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.95rem;
    color: var(--text);
    line-height: 1.5;
}

.detail-icon {
    font-size: 1.1rem;
    width: 1.5rem;
    text-align: center;
    flex-shrink: 0;
}

.rsvp-form {
    margin-top: 2.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    opacity: 0;
}

.rsvp-form input {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid #252220;
    color: var(--text);
    padding: 0.9rem 1rem;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 16px;
    text-align: center;
    outline: none;
    transition: border-color 0.4s;
    border-radius: 0;
    -webkit-appearance: none;
}

.rsvp-form input::placeholder {
    color: var(--text-dim);
    font-style: italic;
}

.rsvp-form input:focus {
    border-color: var(--gold);
}

.rsvp-btn {
    background: transparent;
    border: 1px solid rgba(160, 160, 160, 0.35);
    color: var(--gold);
    padding: 0.9rem;
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s ease;
}

.rsvp-btn:hover {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
}

.rsvp-btn:active {
    transform: scale(0.98);
}

.rsvp-success {
    margin-top: 2rem;
}

.success-text {
    font-family: 'Cinzel', serif;
    font-size: 1.2rem;
    color: var(--gold);
    letter-spacing: 2px;
}

.success-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--text-dim);
    margin-top: 0.6rem;
    font-size: 1rem;
}

#card-screen.active .tagline      { animation: fadeInUp 0.7s ease forwards; }
#card-screen.active .big-30       { animation: fadeInUp 0.7s ease 0.15s forwards; }
#card-screen.active .card-title   { animation: fadeInUp 0.7s ease 0.3s forwards; }
#card-screen.active .divider      { animation: fadeInUp 0.7s ease 0.45s forwards; }
#card-screen.active .details      { animation: fadeInUp 0.7s ease 0.6s forwards; }
#card-screen.active .rsvp-form    { animation: fadeInUp 0.7s ease 0.75s forwards; }

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 480px) {
    .envelope-svg {
        width: 250px;
    }

    .card {
        padding: 2.5rem 1.5rem;
    }

    .card::before {
        inset: 8px;
    }

    .big-30 {
        font-size: 2.4rem;
    }

    .card-title {
        font-size: 1rem;
        letter-spacing: 2px;
    }

    .skip-btn {
        bottom: 1.5rem;
        right: 1.5rem;
    }
}

@media (prefers-reduced-motion: reduce) {
    .particle { animation: none !important; }
    .envelope { animation: none !important; }
    .fog::before, .fog::after { animation: none !important; }
    .screen { transition-duration: 0.01s !important; }

    #card-screen.active .tagline,
    #card-screen.active .big-30,
    #card-screen.active .card-title,
    #card-screen.active .divider,
    #card-screen.active .details,
    #card-screen.active .rsvp-form {
        animation: none !important;
        opacity: 1 !important;
    }
}
    </style>
</head>
<body>

    <section id="envelope-screen" class="screen active">
        <div class="particles" id="particles"></div>
        <div class="fog"></div>
        <div class="envelope-wrapper">
            <div class="envelope">
                <img src="assets/enveloppe.png?v=2" alt="" class="envelope-svg">
            </div>
            <button id="open-btn">Ouvrir l'invitation</button>
        </div>
    </section>

    <section id="video-screen" class="screen">
        <video id="invitation-video" playsinline webkit-playsinline preload="auto">
            <source src="assets/video.mp4?v=2" type="video/mp4">
        </video>
        <button id="play-fallback" class="play-fallback hidden">Lancer la vid&eacute;o</button>
        <button id="skip-video" class="skip-btn">Passer</button>
    </section>

    <section id="card-screen" class="screen">
        <div class="card-scroll">
            <div class="card">
                <p class="tagline">Comme si avoir 30 ans<br>n'&eacute;tait pas d&eacute;j&agrave; assez terrifiant..</p>
                <div class="big-30">Fun&eacute;railles</div>
                <h1 class="card-title">de ma vingtaine</h1>
                <div class="divider"><span>&#9760;</span></div>
                <div class="details">
                    <div class="detail-row">
                        <span class="detail-icon">&#128197;</span>
                        <span>Samedi 7 Novembre 2026</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-icon">&#128343;</span>
                        <span>&Agrave; partir de 19h00</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-icon">&#128205;</span>
                        <span>Lieu bient&ocirc;t r&eacute;v&eacute;l&eacute;...</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-icon">&#128123;</span>
                        <span>Dress code : Halloween Am&eacute;ricain / Cin&eacute;ma / Pop Culture</span>
                    </div>
                </div>
                <form id="rsvp-form" class="rsvp-form">
                    <input type="text" name="prenom" placeholder="Ton pr&eacute;nom" required autocomplete="given-name">
                    <button type="submit" class="rsvp-btn">Je serai pr&eacute;sent</button>
                </form>
                <div id="rsvp-success" class="rsvp-success hidden">
                    <p class="success-text">C'est not&eacute; !</p>
                    <p class="success-sub">&Agrave; tr&egrave;s vite...</p>
                </div>
            </div>
        </div>
    </section>

    <audio id="open-sound" preload="auto">
        <source src="assets/sound.mp3?v=2" type="audio/mpeg">
    </audio>

    <script>
(function () {
    var FORM_EMAIL = 'jordan.join@icloud.com';

    var $ = function (sel) { return document.querySelector(sel); };

    var envelopeScreen = $('#envelope-screen');
    var videoScreen = $('#video-screen');
    var cardScreen = $('#card-screen');
    var audio = $('#open-sound');
    var video = $('#invitation-video');
    var openBtn = $('#open-btn');
    var skipBtn = $('#skip-video');
    var playFallback = $('#play-fallback');
    var form = $('#rsvp-form');
    var successEl = $('#rsvp-success');
    var particlesContainer = $('#particles');

    var videoAvailable = true;

    video.addEventListener('error', function () { videoAvailable = false; });
    var videoSource = video.querySelector('source');
    if (videoSource) {
        videoSource.addEventListener('error', function () { videoAvailable = false; });
    }

    for (var i = 0; i < 15; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.setProperty('--p-opacity', (Math.random() * 0.3 + 0.08).toFixed(2));
        p.style.setProperty('--p-drift', (Math.random() * 50 - 25) + 'px');
        p.style.animationDuration = (Math.random() * 10 + 6) + 's';
        p.style.animationDelay = (Math.random() * 8) + 's';
        var size = Math.random() * 4 + 2;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        particlesContainer.appendChild(p);
    }

    function switchScreen(from, to) {
        from.classList.remove('active');
        to.classList.add('active');
    }

    function showCard() {
        if (cardScreen.classList.contains('active')) return;
        video.pause();
        switchScreen(videoScreen, cardScreen);
    }

    function showVideo() {
        if (videoScreen.classList.contains('active') || cardScreen.classList.contains('active')) return;

        if (!videoAvailable) {
            switchScreen(envelopeScreen, cardScreen);
            return;
        }

        switchScreen(envelopeScreen, videoScreen);

        var playPromise = video.play();
        if (playPromise) {
            playPromise.catch(function () {
                playFallback.classList.remove('hidden');
            });
        }
    }

    openBtn.addEventListener('click', function () {
        var wrapper = openBtn.parentElement;
        wrapper.classList.add('opening');

        audio.play().catch(function () {});

        audio.addEventListener('ended', function () {
            setTimeout(showVideo, 300);
        }, { once: true });

        setTimeout(function () {
            if (!videoScreen.classList.contains('active') && !cardScreen.classList.contains('active')) {
                showVideo();
            }
        }, 4000);
    });

    video.addEventListener('ended', showCard);

    skipBtn.addEventListener('click', showCard);

    playFallback.addEventListener('click', function () {
        playFallback.classList.add('hidden');
        video.play();
    });

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = form.querySelector('input[name="prenom"]').value.trim();
        if (!name) return;

        fetch('https://formsubmit.co/ajax/' + FORM_EMAIL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                prenom: name,
                _subject: 'RSVP - ' + name + ' sera present aux 30 ans !',
                _captcha: 'false',
                _template: 'box'
            })
        }).catch(function () {});

        form.remove();
        successEl.classList.remove('hidden');
    });
})();
    </script>
</body>
</html>
