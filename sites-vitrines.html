<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#07060e;--surface:#0f0d1c;--accent1:#7b4bff;--accent2:#00e5cc;--accent3:#ff3cac;--text:#e8e4f0;--muted:#7a748f;--font-display:'Bebas Neue',sans-serif;--font-syne:'Syne',sans-serif;--font-body:'DM Sans',sans-serif; }
    html { scroll-behavior: smooth; }
    body { background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:300;overflow-x:hidden;cursor:none; }
    .cursor{width:12px;height:12px;background:var(--accent2);border-radius:50%;position:fixed;pointer-events:none;z-index:9999;mix-blend-mode:difference;}
    .cursor-follower{width:36px;height:36px;border:1px solid rgba(123,75,255,0.5);border-radius:50%;position:fixed;pointer-events:none;z-index:9998;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1.5rem 4rem;background:linear-gradient(to bottom,rgba(7,6,14,.95),transparent);backdrop-filter:blur(12px);}
    .nav-logo { display: flex; align-items: center; text-decoration: none; transition: transform 0.2s, filter 0.3s; } .nav-logo svg { display: block; } .nav-logo:hover { transform: translateY(-1px); filter: drop-shadow(0 0 8px rgba(0,229,204,0.5)); }
    .nav-links{display:flex;gap:2.5rem;list-style:none;}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;transition:color .2s;}
    .nav-links a:hover,.nav-links a.active{color:var(--accent2);}
    .grain{position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");opacity:.4;pointer-events:none;z-index:0;}
    .section-label{font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent1);margin-bottom:1rem;}
    .section-title{font-family:var(--font-display);font-size:clamp(2.5rem,5vw,5rem);line-height:1;margin-bottom:3rem;}
    .page-content{padding:10rem 4rem 6rem;position:relative;z-index:1;}
    .reveal{opacity:0;transform:translateY(30px);transition:opacity .7s ease,transform .7s ease;}
    .reveal.visible{opacity:1;transform:none;}
    footer{padding:2rem 4rem;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.05);font-size:.8rem;color:var(--muted);position:relative;z-index:1;}
    footer a{color:var(--muted);text-decoration:none;}
    footer a:hover{color:var(--accent2);}
    @media(max-width:900px){nav{padding:1.2rem 2rem;}.nav-links{display:none;}.page-content{padding:8rem 2rem 4rem;}footer{padding:2rem;}}

    /* MOBILE NAV */
    .burger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; z-index: 99999; position: fixed; top: 1.3rem; right: 1.5rem; }
    .burger span { display: block; width: 24px; height: 1.5px; background: var(--text); transition: transform 0.3s, opacity 0.3s; }
    .mobile-menu {
      visibility: hidden;
      opacity: 0;
      position: fixed; inset: 0;
      background: #ffffff;
      z-index: 99998;
      display: flex;
      flex-direction: column;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      overflow: hidden;
    }
    .mobile-menu.open { visibility: visible; opacity: 1; }
    body.menu-open .burger { display: none; }
    .mobile-menu-close {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      background: none; border: none;
      font-size: 2rem; color: #000;
      cursor: pointer; line-height: 1;
      padding: 0.5rem;
    }
    .mobile-menu a {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2rem;
      letter-spacing: 0.1em;
      color: #000;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      transition: background 0.15s, color 0.15s;
    }
    .mobile-menu a:first-of-type { border-top: 1px solid rgba(0,0,0,0.08); }
    .mobile-menu a:hover { background: #f5f5f5; }
    @media (max-width: 900px) { .burger { display: flex; } .cursor, .cursor-follower { display: none !important; } body { cursor: auto !important; } * { cursor: auto !important; } }
  </style>
  <title>Sites vitrines — On fait des bulles ?</title>
  <style>
    .placeholder-note { max-width: 600px; color: var(--muted); line-height: 1.8; }
  </style>
</head>
<body>
<nav><a href="index.html" class="nav-logo" aria-label="Accueil"><svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="navIconGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#a0b4ff"/><stop offset="70%" stop-color="#d0f0ff"/><stop offset="100%" stop-color="#ffffff"/></linearGradient></defs><path d="M5 15 L16 5 L27 15" stroke="url(#navIconGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 13 V27 H24 V13" stroke="url(#navIconGrad)" stroke-width="2" stroke-linejoin="round"/><path d="M13 27 V19 H19 V27" stroke="url(#navIconGrad)" stroke-width="2" stroke-linejoin="round"/></svg></a><ul class="nav-links"><li><a href="services.html" >Services</a></li><li><a href="projets.html" >Projets</a></li><li><a href="apropos.html" >À propos</a></li><li><a href="contact.html" >Contact</a></li></ul></nav>

  <div class="burger" id="burger" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <button class="mobile-menu-close" onclick="toggleMenu()">&#x2715;</button>
    <a href="index.html" onclick="toggleMenu()">Accueil</a>
    <a href="services.html" onclick="toggleMenu()">Nos services</a>
    <a href="projets.html" onclick="toggleMenu()">Nos r&#233;alisations</a>
    <a href="apropos.html" onclick="toggleMenu()">&Agrave; propos</a>
    <a href="contact.html" onclick="toggleMenu()">Contact</a>
  </div>
  <div class="page-content">
    <div class="reveal">
      <p class="section-label">Nos réalisations</p>
      <h1 class="section-title">Sites vitrines</h1>
      <p class="placeholder-note">Cette page est en construction — les projets de sites vitrines arrivent bientôt.</p>
    </div>
  </div>
<footer><span>© 2026 On fait des bulles ?</span><span>Lyon, France</span></footer>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="follower"></div>
  <div class="grain"></div>
  <script>
    const cursor=document.getElementById('cursor'),follower=document.getElementById('follower');
    const hasHover=window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if(!hasHover){cursor.style.display='none';follower.style.display='none';document.body.style.cursor='auto';}
    else {
      let mx=0,my=0,fx=0,fy=0;
      document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx-6+'px';cursor.style.top=my-6+'px';});
      function animateFollower(){fx+=(mx-fx)*0.18;fy+=(my-fy)*0.18;follower.style.left=fx-18+'px';follower.style.top=fy-18+'px';requestAnimationFrame(animateFollower);}
      animateFollower();
    }
    document.querySelectorAll('.reveal').forEach((r,i)=>{new IntersectionObserver(([e])=>{if(e.isIntersecting)setTimeout(()=>r.classList.add('visible'),i*60);},{threshold:.1}).observe(r);});
  </script>
  <script>
    function toggleMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('open');
      document.body.classList.toggle('menu-open');
      document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
    }
  </script>
</body>
</html>
